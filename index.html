<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box, .app {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,.12);
        }
        .login-box {
            width: 380px;
            padding: 30px;
        }
        .login-box h1 {
            margin-top: 0;
            text-align: center;
            color: #1f4e79;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            padding: 11px 18px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            background: #1f4e79;
            color: white;
            margin-top: 10px;
        }
        button:hover { opacity: .9; }
        .login-box button {
            width: 100%;
        }
        .error {
            color: #c0392b;
            text-align: center;
            margin-top: 12px;
        }
        .app { min-height: 100vh; }
        header {
            background: #1f4e79;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { margin: 0; }
        .logout { background: #c0392b; margin: 0; }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            margin-bottom: 24px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .form-grid input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th { background: #eef2f5; }
        .danger { background: #c0392b; }
        .message {
            margin-top: 12px;
            font-weight: bold;
        }
        @media (max-width: 700px) {
            .form-grid { grid-template-columns: 1fr; }
            .container { margin: 10px; padding: 10px; }
            header { padding: 15px; }
            header h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <h1>Student Login</h1>

        <form onsubmit="login(event)">
            <input id="username" type="text"
                   placeholder="Username" required>

            <input id="password" type="password"
                   placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <div id="loginError" class="error"></div>

        <p style="text-align:center; color:#666;">
            Demo login: <b>admin</b> / <b>admin123</b>
        </p>
    </div>
</div>

<!-- APPLICATION -->
<div id="app" class="app" style="display:none;">

    <header>
        <h1>Student Management System</h1>
        <button class="logout" onclick="logout()">Logout</button>
    </header>

    <div class="container">

        <div class="card">
            <h2>Add Student</h2>

            <div class="form-grid">
                <input id="name" type="text"
                       placeholder="Student Name">

                <input id="email" type="email"
                       placeholder="Email">

                <input id="course" type="text"
                       placeholder="Course">
            </div>

            <button onclick="addStudent()">Add Student</button>
            <button onclick="loadStudents()">View Students</button>

            <div id="message" class="message"></div>
        </div>

        <div class="card">
            <h2>Students</h2>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                    <tr>
                        <td colspan="5">
                            Click "View Students" to load data.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<script>
    const API_URL = "/api/students";

    /*
     * DEMO LOGIN
     * Username: admin
     * Password: admin123
     *
     * This client-side login is for learning/demo purposes only.
     * Real authentication should be handled by Spring Security
     * on the Java backend.
     */
    function login(event) {
        event.preventDefault();

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;

        if (username === "admin" && password === "admin123") {
            sessionStorage.setItem("loggedIn", "true");

            document.getElementById("loginScreen")
                .style.display = "none";

            document.getElementById("app")
                .style.display = "block";

            loadStudents();
        } else {
            document.getElementById("loginError").textContent =
                "Invalid username or password.";
        }
    }

    function logout() {
        sessionStorage.removeItem("loggedIn");

        document.getElementById("app").style.display = "none";
        document.getElementById("loginScreen").style.display = "flex";

        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
    }

    async function loadStudents() {
        try {
            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Unable to load students");
            }

            const students = await response.json();
            const table = document.getElementById("studentTable");

            if (students.length === 0) {
                table.innerHTML =
                    '<tr><td colspan="5">No students found.</td></tr>';
                return;
            }

            table.innerHTML = students.map(student => `
                <tr>
                    <td>${student.id}</td>
                    <td>${escapeHtml(student.name)}</td>
                    <td>${escapeHtml(student.email)}</td>
                    <td>${escapeHtml(student.course)}</td>
                    <td>
                        <button class="danger"
                            onclick="deleteStudent(${student.id})">
                            Delete
                        </button>
                    </td>
                </tr>
            `).join("");

        } catch (error) {
            showMessage(error.message, true);
        }
    }

    async function addStudent() {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const course = document.getElementById("course").value.trim();

        if (!name || !email || !course) {
            showMessage("Please fill all fields.", true);
            return;
        }

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    course: course
                })
            });

            if (!response.ok) {
                throw new Error("Failed to add student");
            }

            showMessage("Student added successfully!");

            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("course").value = "";

            loadStudents();

        } catch (error) {
            showMessage(error.message, true);
        }
    }

    async function deleteStudent(id) {
        if (!confirm("Delete this student?")) {
            return;
        }

        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                throw new Error("Failed to delete student");
            }

            showMessage("Student deleted successfully!");
            loadStudents();

        } catch (error) {
            showMessage(error.message, true);
        }
    }

    function showMessage(message, error = false) {
        const element = document.getElementById("message");
        element.textContent = message;
        element.style.color =
            error ? "#c0392b" : "#1e8449";
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    // Keep the login after refreshing the page during this demo.
    if (sessionStorage.getItem("loggedIn") === "true") {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("app").style.display = "block";
    }
</script>

</body>
</html>
